    <script>
      /* if a stylesheet/script from an older deploy is missing, reload once to get the new version */
      addEventListener('error', function (e) {
        var t = e.target;
        if (t && (t.tagName === 'LINK' || t.tagName === 'SCRIPT') && /\/assets\//.test(t.href || t.src || '')) {
          try { if (!sessionStorage.getItem('aspira-asset-reload')) { sessionStorage.setItem('aspira-asset-reload', '1'); location.reload(); } } catch (x) {}
        }
      }, true);
      addEventListener('load', function () { setTimeout(function () { try { sessionStorage.removeItem('aspira-asset-reload'); } catch (x) {} }, 10000); });
